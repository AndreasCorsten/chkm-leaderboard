<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHKM 2026 - Leaderboard</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <div id="header-bar">
    <img src="logo.png" alt="CHKM 2026 logo" id="logo">
    <h1>CHKM 2026 - Leaderboard</h1>
  </div>

  <!-- ===== SITE NAVIGATION (3 sider) ===== -->
  <nav id="site-nav">
    <button class="nav-button active" data-page="schedule">Tidsplan</button>
    <button class="nav-button" data-page="leaderboard">Leaderboard</button>
    <button class="nav-button" data-page="heats">Heatplan</button>
  </nav>

  <!-- ===== SIDE 1: TIDSPLAN ===== -->
  <div id="page-schedule" class="page active">
    <h2 class="section-title">Tidsplan</h2>
    <div id="schedule-list"></div>
  </div>

  <!-- ===== SIDE 2: LEADERBOARD ===== -->
  <div id="page-leaderboard" class="page">
    <div id="tabs">
      <button class="tab-button active" data-division="Herre RX">Herre RX</button>
      <button class="tab-button" data-division="Dame RX">Dame RX</button>
      <button class="tab-button" data-division="Herre Scaled">Herre Scaled</button>
      <button class="tab-button" data-division="Dame Scaled">Dame Scaled</button>
    </div>

    <div id="leaderboard-container">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <p id="last-updated"></p>
  </div>

  <!-- ===== SIDE 3: HEATPLAN ===== -->
  <div id="page-heats" class="page">
    <h2 class="section-title">Heat-oversigt</h2>
    <div id="heats-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
